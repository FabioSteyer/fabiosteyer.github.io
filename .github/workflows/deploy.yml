name: Deploy to GitHub Pages

# Bewusst KEIN Push-Trigger: Die Seite geht erst live, wenn die Freigabepruefung
# (Schritt C1 im Umsetzungsplan) durch ist. Bis dahin nur manuell startbar.
#
# STAND 12.09.2026: Dieser Workflow laeuft NICHT. GitHub bricht ihn nach zwei Sekunden ab:
# "The job was not started because your account is locked due to a billing issue."
# Die Seite wird stattdessen aus dem Branch gh-pages ausgeliefert. Siehe DEPLOY.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
