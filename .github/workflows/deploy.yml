name: Deploy to GitHub Pages

# Bewusst KEIN Push-Trigger: Die Seite geht erst live, wenn die Freigabepruefung
# (Schritt C1 im Umsetzungsplan) durch ist. Bis dahin nur manuell startbar.
#
# STAND 14.09.2026: Die Abrechnungssperre ist weg — der Lauf 34881022022 wurde tatsaechlich
# ausgefuehrt (16 s) statt nach zwei Sekunden abgebrochen. Er scheiterte am Node-Stand,
# siehe Kommentar unten. Die Seite wird weiterhin aus dem Branch gh-pages ausgeliefert;
# die Pages-Quelle steht noch auf legacy/gh-pages. Siehe DEPLOY.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # withastro/action startet sonst mit Node 20; Astro 7.3.2 verlangt >= 22.12.0
          # (package.json engines). Ohne diese Zeile bricht "astro build" sofort ab.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
