name: Deploy to GitHub Pages

# Bewusst KEIN Push-Trigger: Die Seite geht erst live, wenn die Freigabepruefung
# (Schritt C1 im Umsetzungsplan) durch ist. Bis dahin nur manuell startbar.
#
# STAND 14.09.2026: Dieser Workflow ist wieder der Lieferweg. Die Abrechnungssperre ist weg,
# Pages steht auf build_type=workflow, Lauf 34882189100 lief gruen durch (Build und Deploy).
# Branch gh-pages und scripts/deploy-gh-pages.ps1 bleiben als Rueckfallebene. Siehe DEPLOY.md.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # withastro/action startet sonst mit Node 20; Astro 7.3.2 verlangt >= 22.12.0
          # (package.json engines). Ohne diese Zeile bricht "astro build" sofort ab.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
